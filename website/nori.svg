<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" role="img" aria-label="Nori the hamster peeking over a bento box">
  <defs>
    <!-- Ears, head and cheeks as one shape, so they share a single outline. -->
    <g id="silhouette">
      <circle cx="58" cy="44" r="17"/>
      <circle cx="142" cy="44" r="17"/>
      <ellipse cx="100" cy="84" rx="60" ry="54"/>
      <circle cx="50" cy="102" r="27"/>
      <circle cx="150" cy="102" r="27"/>
    </g>
  </defs>
  <use href="#silhouette" xlink:href="#silhouette" fill="#2B2320" stroke="#2B2320" stroke-width="10"/>
  <use href="#silhouette" xlink:href="#silhouette" fill="#FFF8EC"/>
  <!-- inner ears and the one patch of fur -->
  <circle cx="58" cy="45" r="8" fill="#F9D3C4"/>
  <circle cx="142" cy="45" r="8" fill="#F9D3C4"/>
  <path d="M60 58Q100 18 140 58Q120 50 100 66Q80 50 60 58z" fill="#F5CFA0"/>
  <ellipse cx="50" cy="106" rx="11" ry="7" fill="#F9C9BC"/>
  <ellipse cx="150" cy="106" rx="11" ry="7" fill="#F9C9BC"/>
  <!-- face -->
  <circle cx="77" cy="84" r="8" fill="#2B2320"/>
  <circle cx="123" cy="84" r="8" fill="#2B2320"/>
  <circle cx="80" cy="81" r="2.800" fill="#FFFFFF"/>
  <circle cx="126" cy="81" r="2.800" fill="#FFFFFF"/>
  <path d="M95 94h10a1.500 1.500 0 0 1 1.100 2.500l-5 4.500a1.600 1.600 0 0 1-2.200 0l-5-4.500A1.500 1.500 0 0 1 95 94z" fill="#2B2320"/>
  <path d="M90 105q5 6 10 0q5 6 10 0" fill="none" stroke="#2B2320" stroke-width="4" stroke-linecap="round"/>
  <!-- bento box: pale body, lacquer rim -->
  <g stroke="#2B2320" stroke-width="5" stroke-linejoin="round">
    <rect x="30" y="134" width="140" height="54" rx="14" fill="#FFF8EC"/>
    <rect x="22" y="124" width="156" height="22" rx="11" fill="#C24E36"/>
  </g>
  <!-- five columns, with Next lit -->
  <g stroke="#2B2320" stroke-width="3" fill="none">
    <circle cx="66" cy="167" r="6.500"/>
    <circle cx="83" cy="167" r="6.500" fill="#8CC765"/>
    <circle cx="100" cy="167" r="6.500"/>
    <circle cx="117" cy="167" r="6.500"/>
    <circle cx="134" cy="167" r="6.500"/>
  </g>
  <!-- onigiri and paws on the rim -->
  <g transform="translate(0 5)" stroke="#2B2320" stroke-linejoin="round">
    <path d="M100 109q4 0 6.500 4l13 21q3 6-4 6.500h-31q-7-.5-4-6.500l13-21q2.500-4 6.500-4z" fill="#FFFFFF" stroke-width="5"/>
    <rect x="90" y="128" width="20" height="12.500" rx="2" fill="#2B2320" stroke="none"/>
  </g>
  <g fill="#FFF8EC" stroke="#2B2320" stroke-width="5">
    <ellipse cx="70" cy="128" rx="13" ry="9.500"/>
    <ellipse cx="130" cy="128" rx="13" ry="9.500"/>
  </g>
</svg>
